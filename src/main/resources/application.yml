spring:
  application:
    name: billing-payment-service

  profiles.active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/billing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate          # NEVER auto-create in any environment — use schema.sql
    show-sql: false               # flip to true locally if you need to debug queries
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  sql:
    init:
      mode: never                 # schema.sql is run manually / by migration scripts

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never        # never leak stack traces to the client
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:default-secret-key-that-is-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  services:
    utility-service-url: ${UTILITY_SERVICE_URL:http://localhost:8082}
    group2-lease-service-url: ${GROUP2_LEASE_SERVICE_URL:http://localhost:8083}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

