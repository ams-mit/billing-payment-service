spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/billing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  sql:
    init:
      mode: "never"

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: "never"
    include-stacktrace: "never"

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "when-authorized"
  info:
    app:
      enabled: true

springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operationsSorter: "method"
    tagsSorter: "alpha"

app:
  jwt:
    # Gateway RSA public key — used to verify ALL incoming JWTs (user and service)
    # In production: load from GATEWAY_JWT_PUBLIC_KEY env var (PEM format)
    # In dev/test: we use a generated RSA key pair locally
    gateway-public-key: ${GATEWAY_JWT_PUBLIC_KEY:#{T(java.nio.file.Files).exists(T(java.nio.file.Path).of('src/test/resources/keys/gateway-public.pem')) ? T(java.nio.file.Files).readString(T(java.nio.file.Path).of('src/test/resources/keys/gateway-public.pem')) : ''}}

    # This service's RSA private key — used to sign outgoing Service JWTs
    # when calling other services through the Gateway
    service-private-key: ${SERVICE_JWT_PRIVATE_KEY:#{T(java.nio.file.Files).exists(T(java.nio.file.Path).of('src/test/resources/keys/service-private.pem')) ? T(java.nio.file.Files).readString(T(java.nio.file.Path).of('src/test/resources/keys/service-private.pem')) : ''}}

    service-name: billing-payment-service
    service-jwt-expiry-ms: 300000   # 5 minutes per v2.1 spec

  services:
    api-gateway-url: "${API_GATEWAY_URL:http://localhost:8080}"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
