spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/billing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  sql:
    init:
      mode: "never"

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: "never"
    include-stacktrace: "never"

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "when-authorized"
  info:
    app:
      enabled: true

springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operationsSorter: "method"
    tagsSorter: "alpha"

app:
  jwt:
  jwt:
    gateway-public-key: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
    service-private-key: "-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----"
    service-name: ${SERVICE_NAME:billing-payment-service}
    service-jwt-expiry-ms: 300000

  services:
    api-gateway-url: "${API_GATEWAY_URL:http://localhost:8080}"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
